services:
  # ── Backend API (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: slopeeva-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ── Frontend (React + Vite) ────────────────────────────────────────────────
  - type: web
    name: slopeeva-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: slopeeva-backend
          type: web
          property: host
